<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scroll Love Particle</title>

<style>

body{
margin:0;
height:900vh;
background:white;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

</style>

</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

function resize(){
canvas.width = window.innerWidth
canvas.height = window.innerHeight
}
resize()
window.addEventListener("resize", resize)

const particles=[]
const particleCount=900

class Particle{

constructor(){

this.x=Math.random()*canvas.width
this.y=Math.random()*canvas.height

this.tx=this.x
this.ty=this.y

this.size=10

}

draw(){

ctx.font=this.size+"px serif"
ctx.fillText("❤️",this.x,this.y)

}

update(){

this.x+=(this.tx-this.x)*0.08
this.y+=(this.ty-this.y)*0.08

}

}

for(let i=0;i<particleCount;i++){
particles.push(new Particle())
}

const letters=[
"R","I","K","O",
"S","A","Y","A","N","G",
"M","U","N","A"
]

let shapes=[]

function createOutline(text){

const off=document.createElement("canvas")
const octx=off.getContext("2d")

off.width=canvas.width
off.height=canvas.height

let fontSize=canvas.width<600?140:200

octx.strokeStyle="black"
octx.lineWidth=6
octx.textAlign="center"
octx.font="bold "+fontSize+"px Arial"

octx.strokeText(text,off.width/2,off.height/2)

const data=octx.getImageData(0,0,off.width,off.height).data

const points=[]

for(let y=0;y<off.height;y+=5){
for(let x=0;x<off.width;x+=5){

const index=(y*off.width+x)*4

if(data[index+3]>150){
points.push({x,y})
}

}
}

return points

}

function heartShape(){

const points=[]

for(let t=0;t<Math.PI*2;t+=0.01){

let x=16*Math.pow(Math.sin(t),3)
let y=
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t)

points.push({

x:canvas.width/2 + x*10,
y:canvas.height/2 - y*10

})

}

return points

}

letters.forEach(l=>{
shapes.push(createOutline(l))
})

shapes.push(heartShape())

function scrollStage(){

const scroll=window.scrollY
const max=document.body.scrollHeight-window.innerHeight

const progress=scroll/max

return Math.floor(progress*shapes.length)

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

let stage=scrollStage()

let target=shapes[stage] || shapes[shapes.length-1]

particles.forEach((p,i)=>{

let point=target[i%target.length]

p.tx=point.x
p.ty=point.y

p.update()
p.draw()

})

requestAnimationFrame(animate)

}

animate()

</script>

</body>
</html>
