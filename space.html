<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #f5f5f5;
            touch-action: none;
            font-family: sans-serif;
        }

        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 1600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera {
            position: relative;
            transform-style: preserve-3d;
        }

        .card {

            position: absolute;
            width: 170px;
            height: 210px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);

            overflow: hidden;

        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .textCard {

            font-size: 18px;
            padding: 20px;
            text-align: center;
            line-height: 1.4;

        }
    </style>
</head>


<body>

    <div class="scene">
        <div class="camera" id="camera"></div>
    </div>


    <script>

        const camera = document.getElementById("camera")

        // ======================================
        // TEMPAT ANDA MENARUH FOTO & TEKS
        // ======================================

        const contentData = [

            { type: "photo", src: "/photo/1.jpg" },
            { type: "text", text: "Aku sayang kamu" },
            { type: "photo", src: "/photo/2.jpg" },
            { type: "text", text: "Kamu cantik" },
            { type: "photo", src: "/photo/3.jpg" },
            { type: "text", text: "Selalu bersamamu" },
            { type: "photo", src: "/photo/4.jpg" },
            { type: "text", text: "Terima kasih ada" },
            { type: "photo", src: "/photo/5.jpg" },

            { type: "photo", src: "/photo/6.jpg" },
            { type: "text", text: "Kamu bahagiaku" },
            { type: "photo", src: "/photo/7.jpg" },
            { type: "text", text: "Aku rindu" },
            { type: "photo", src: "/photo/8.jpg" },
            { type: "text", text: "Cinta selamanya" },
            { type: "photo", src: "/photo/9.jpg" },
            { type: "text", text: "Kamu rumahku" },
            { type: "photo", src: "/photo/10.jpg" },

            { type: "photo", src: "/photo/11.jpg" },
            { type: "text", text: "My love" },
            { type: "photo", src: "/photo/12.jpg" },
            { type: "text", text: "Forever" },
            { type: "photo", src: "/photo/13.jpg" },
            { type: "text", text: "Always" },
            { type: "photo", src: "/photo/14.jpg" },
            { type: "text", text: "Together" },
            { type: "photo", src: "/photo/15.jpg" },

            { type: "photo", src: "/photo/16.jpg" },
            { type: "text", text: "My heart" },
            { type: "photo", src: "/photo/17.jpg" },
            { type: "text", text: "My world" },
            { type: "photo", src: "/photo/18.jpg" },
            { type: "text", text: "My life" },
            { type: "photo", src: "/photo/19.jpg" },
            { type: "text", text: "My happiness" },
            { type: "photo", src: "/photo/20.jpg" },

            { type: "photo", src: "/photo/21.jpg" },
            { type: "text", text: "Always you" },
            { type: "photo", src: "/photo/22.jpg" },
            { type: "text", text: "Only you" },
            { type: "photo", src: "/photo/23.jpg" },
            { type: "text", text: "My angel" },
            { type: "photo", src: "/photo/24.jpg" },
            { type: "text", text: "My future" },
            { type: "photo", src: "/photo/25.jpg" }

        ]

        // ======================================
        // CONFIG
        // ======================================

        const grid = 3
        const layers = 5

        const spacing = 300        // jarak antar card
        const depthSpacing = 2000  // jarak antar layer (DIPERJAUH)

        // ======================================
        // GENERATE CARD
        // ======================================

        let index = 0

        for (let l = 0; l < layers; l++) {

            for (let y = 0; y < grid; y++) {
                for (let x = 0; x < grid; x++) {

                    let data = contentData[index++]

                    const card = document.createElement("div")
                    card.className = "card"

                    if (data.type === "photo") {

                        const img = document.createElement("img")
                        img.src = data.src

                        card.appendChild(img)

                    } else {

                        card.classList.add("textCard")
                        card.innerText = data.text

                    }

                    const posX = (x - (grid - 1) / 2) * spacing
                    const posY = (y - (grid - 1) / 2) * spacing
                    const posZ = -(l * depthSpacing)

                    card.style.transform =
                        `translateX(${posX}px)
 translateY(${posY}px)
 translateZ(${posZ}px)`

                    camera.appendChild(card)

                }
            }

        }


        // ======================================
        // CAMERA CONTROL
        // ======================================

        let camX = 0
        let camY = 0
        let camZ = -1000

        function updateCamera() {

            camera.style.transform =
                `translateX(${camX}px)
 translateY(${camY}px)
 translateZ(${camZ}px)`

        }

        updateCamera()

        let startX, startY

        document.addEventListener("touchstart", (e) => {

            if (e.touches.length === 1) {

                startX = e.touches[0].clientX
                startY = e.touches[0].clientY

            }

        })


        document.addEventListener("touchmove", (e) => {

            if (e.touches.length === 1) {

                let dx = e.touches[0].clientX - startX
                let dy = e.touches[0].clientY - startY

                camX += dx * 0.5
                camY += dy * 0.5

                startX = e.touches[0].clientX
                startY = e.touches[0].clientY

                updateCamera()

            }

        })


        let startDist = 0

        document.addEventListener("touchstart", (e) => {

            if (e.touches.length === 2) {
                startDist = getDistance(e.touches)
            }

        })


        document.addEventListener("touchmove", (e) => {

            if (e.touches.length === 2) {

                let dist = getDistance(e.touches)

                let diff = dist - startDist

                camZ += diff * 2

                startDist = dist

                updateCamera()

            }

        })


        function getDistance(t) {

            let dx = t[0].clientX - t[1].clientX
            let dy = t[0].clientY - t[1].clientY

            return Math.sqrt(dx * dx + dy * dy)

        }

    </script>

</body>

</html>
